name: Publish Deewari Squad
on:
  push:
    branches: [main]
    paths: [DeewariSquad-site.zip, .github/workflows/publish.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deewari-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack compiled release
        run: |
          mkdir -p _site
          unzip -q DeewariSquad-site.zip -d _site
          test -f _site/index.html
          test -f _site/download/BurneyDeewariSquad.apk
          test -f _site/download/version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

